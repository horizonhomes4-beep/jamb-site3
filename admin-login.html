<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Admin sign-in — MathCloud Tutorial</title><link rel="icon" href="assets/logo.png"><link rel="stylesheet" href="assets/style.css"><style>.login-status{margin-top:14px;padding:12px 14px;border-radius:11px;display:none;line-height:1.5}.login-status.show{display:block}.login-status.error{background:#fff0f0;color:#a32222}.login-status.ok{background:#ecfaf2;color:#17683c}.login-status.info{background:#eef5ff;color:#164b9a}</style></head><body><div class="auth-wrap"><div class="auth-card"><div class="auth-logo"><div class="brand-badge"><img src="assets/logo.png" style="width:100%;height:100%;object-fit:cover;border-radius:14px"></div><h1>Admin sign-in</h1><div class="muted">MathCloud JAMB console</div></div><label>Email</label><input id="aEmail" type="email" autocomplete="username" placeholder="Administrator email"><label>Password</label><input id="aPassword" type="password" autocomplete="current-password" placeholder="Administrator password"><button class="btn btn-primary btn-block" id="btn" style="margin-top:18px" onclick="login()">Log in</button><button class="btn btn-block" style="margin-top:9px" onclick="forgotAdminPassword()">Forgot password?</button><div id="status" class="login-status"></div><p class="muted">Use the exact email and password created on the first-admin setup page.</p></div></div><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script><script src="assets/firebase-config.js"></script><script src="assets/app.js"></script><script>
const statusBox=document.getElementById('status');
function showStatus(m,t='info'){statusBox.textContent=m;statusBox.className='login-status show '+t;}
async function forgotAdminPassword(){const email=document.getElementById('aEmail').value.trim().toLowerCase();if(!email){showStatus('Enter the administrator email address first.','error');return;}try{await auth.sendPasswordResetEmail(email);showStatus('Password reset email sent. Check the inbox and spam/junk folder.','ok');}catch(e){showStatus(e.code==='auth/user-not-found'?'No Firebase Authentication account was found for this email.':(e.message||'Could not send password reset email.'),'error');}}
async function login(){const b=document.getElementById('btn');const email=document.getElementById('aEmail').value.trim().toLowerCase();const password=document.getElementById('aPassword').value;if(!email||!password){showStatus('Enter your administrator email and password.','error');return;}b.disabled=true;b.textContent='Signing in…';showStatus('Authenticating with Firebase…','info');try{const cred=await auth.signInWithEmailAndPassword(email,password);const allowed=await db.ref('settings/adminUsers/'+cred.user.uid).once('value');if(allowed.val()!==true){await auth.signOut();throw new Error('FIREBASE_ADMIN_NOT_AUTHORIZED');}await mcAdmin.loginFirebase(email,cred.user.uid);showStatus('Login successful. Opening admin console…','ok');location.replace('admin.html');}catch(e){await auth.signOut().catch(()=>{});let msg='Admin login failed.';if(e.code==='auth/user-not-found')msg='No Firebase Authentication account was found for this email.';else if(e.code==='auth/invalid-credential')msg='The email or password is incorrect.';else if(e.code==='auth/wrong-password')msg='The email or password is incorrect.';else if(e.message==='FIREBASE_ADMIN_NOT_AUTHORIZED')msg='This Firebase account exists, but it is not registered as a MathCloud administrator.';else if(e.message==='ADMIN_PROFILE_NOT_FOUND')msg='The Firebase account is authenticated, but its MathCloud administrator profile is missing. Run the first-admin setup again only on a new Firebase deployment.';else if(e.code==='PERMISSION_DENIED')msg='Firebase denied access. Publish the corrected database rules and try again.';else if(e.message)msg=e.message;showStatus(msg,'error');}finally{b.disabled=false;b.textContent='Log in';}}
</script></body></html>
