<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MathCloud JAMB Seeder</title><style>body{font-family:Arial;background:#07111f;color:#eef;padding:30px}main{max-width:900px;margin:auto;background:#0d2035;padding:25px;border-radius:18px}button{padding:13px 18px;border:0;border-radius:10px;background:#f5b942;font-weight:800;cursor:pointer}.ok{color:#6ee7b7}.muted{color:#9fb0c7;line-height:1.7}pre{background:#071321;padding:15px;border-radius:10px;white-space:pre-wrap}</style></head><body><main><h1>MathCloud JAMB / UTME Seeder</h1><p class="muted">Run this page while logged into the MathCloud Admin Console. It seeds the public JAMB subject/course catalogue, JAMB subjects in the learning database, and launch subscription plans.</p><button onclick="seed()">Seed / update JAMB platform</button><div id="status" class="muted" style="margin-top:15px"></div></main>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script><script src="assets/firebase-config.js"></script><script>
window.addEventListener('error', function(e){
  const el=document.getElementById('status');
  if(el) el.textContent='Seeder page error: '+(e.message||'Unknown JavaScript error');
});
</script>
<script>
async function seed(){const st=document.getElementById('status');try{if(!mcAdmin.isLoggedIn())throw new Error('Please log into Admin Console first, then open this seeder in the same browser tab/session.');const data=await fetch('seed-data/jamb-curriculum.json').then(r=>r.json());const updates={};updates['jambCatalog']={version:data.version,source:data.source,courses:data.courses,subjects:data.subjects,...adminMeta};for(const sub of data.subjects){updates['subjects/'+sub.id]={name:sub.name,category:sub.category,topics:{},...adminMeta};}const plans={"jamb-1m":{label:'JAMB 1 Month',months:1,price:5000,description:'Full JAMB learning access for 30 days.',...adminMeta},"jamb-3m":{label:'JAMB 3 Months',months:3,price:12000,description:'Save 20% versus monthly pricing.',...adminMeta},"jamb-6m":{label:'JAMB 6 Months',months:6,price:20000,description:'Save about 33% versus monthly pricing.',...adminMeta}};Object.entries(plans).forEach(([id,p])=>updates['settings/plans/'+id]=p);await db.ref().update(updates);st.innerHTML='<span class="ok">JAMB catalogue, subjects and subscription plans seeded successfully.</span><pre>'+JSON.stringify({subjects:data.subjects.length,courses:data.courses.length,plans:Object.keys(plans).length},null,2)+'</pre>';}catch(e){st.textContent=e.message||String(e);}}
</script></body></html>
