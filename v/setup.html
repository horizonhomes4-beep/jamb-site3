<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MathCloud JAMB Admin Setup</title><link rel="stylesheet" href="assets/style.css"></head><body><div class="card" style="max-width:480px;margin:50px auto"><h1>MathCloud JAMB admin setup</h1><p class="muted">Run this once for a new Firebase deployment. It creates the admin in Firebase Authentication and the MathCloud admin registry.</p><label>Admin name</label><input id="name" value="Marshall Jacob"><label>Admin email</label><input id="email" value="marshall12340@gmail.com"><label>Password</label><input id="password" type="password"><button class="btn btn-primary btn-block" id="btn" style="margin-top:15px" onclick="setup()">Create admin</button><div id="status" class="muted" style="margin-top:12px"></div></div><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script><script src="assets/firebase-config.js"></script><script src="assets/app.js"></script><script>async function setup(){const b=document.getElementById('btn'),st=document.getElementById('status'),name=document.getElementById('name').value.trim(),email=document.getElementById('email').value.trim().toLowerCase(),password=document.getElementById('password').value;if(!name||!email||password.length<8){st.textContent='Enter all fields; use at least 8 password characters.';return;}b.disabled=true;try{const exists=await db.ref('settings/adminInfo').once('value');if(exists.exists())throw new Error('An admin is already configured.');const cred=await auth.createUserWithEmailAndPassword(email,password);const uid=cred.user.uid;const adminId=db.ref().push().key;const passwordHash=await mcHash(password);await db.ref().update({['admins/'+adminId]:{name,email,passwordHash,createdAt:Date.now()},['settings/adminIndex/'+mcDbKey(email)]:adminId,['settings/adminInfo']:{name,email}});await db.ref('settings/adminUsers/'+uid).set(true);st.innerHTML='<span style="color:#6ee7b7">Admin created. <a href="admin-login.html">Open admin login</a>.</span>';}catch(e){st.textContent=e.message||'Setup failed.';}finally{b.disabled=false;}}</script></body></html>
